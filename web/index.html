<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOZENI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KOZENI">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --key: #ffffff; --key-active: #e8e7e1; --op: #ecebe5;
    --text: #1a1a19; --sub: #6b6a65; --muted: #9a988f; --line: #e1e0d9;
    --accent: #2a78d6; --warn: #a86a00; --warn-bg: #fbf0d9; --ng: #c62f2f; --ng-bg: #fbe5e5; --ok: #2f7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --card: #242422; --key: #2c2c2a; --key-active: #3a3a37; --op: #34342f;
      --text: #f0efec; --sub: #b4b2a9; --muted: #888780; --line: #383835;
      --accent: #3987e5; --warn: #f0b84a; --warn-bg: #3a2f17; --ng: #ef6b6b; --ng-bg: #3d1f1f; --ok: #6cc070;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: pointer; }
  [hidden] { display: none !important; }

  #app {
    max-width: 440px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px; }
  .label { font-size: 13px; color: var(--sub); }
  .spent { font-size: 22px; font-weight: 600; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .sync { font-size: 12px; padding: 3px 10px; border-radius: 999px; color: var(--sub); background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
  .sync.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
  .sync.ng { color: var(--ng); background: var(--ng-bg); border-color: transparent; }
  .icon { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }

  .display { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 8px 8px 12px; min-height: 96px; }
  .expr { font-size: 15px; color: var(--sub); min-height: 22px; }
  .expr.ng { color: var(--ng); }
  .amount { font-size: 48px; font-weight: 600; line-height: 1.1; letter-spacing: -0.5px; }
  .amount.zero { color: var(--muted); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .cat {
    min-height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 13px; line-height: 1.25; padding: 6px 4px; text-align: center; word-break: break-all;
  }
  .cat:active { background: var(--key-active); }
  .cat .dot { width: 8px; height: 8px; border-radius: 2px; }
  .cats-empty { grid-column: 1 / -1; font-size: 14px; color: var(--sub); text-align: center; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; background: none; }

  .pad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 62px; gap: 8px; }
  .key { border: 0; border-radius: 14px; background: var(--key); font-size: 24px; }
  .key:active { background: var(--key-active); }
  .key.op { background: var(--op); font-size: 20px; }
  .key.zero { grid-column: span 2; }
  .key.plus { grid-row: span 2; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 64px);
    width: min(416px, calc(100% - 24px)); background: var(--text); color: var(--bg); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; overflow: hidden; z-index: 10;
  }
  .toast .msg { flex: 1; font-size: 15px; }
  .toast button { border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; padding: 4px; }
  .toast .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 100%; transform-origin: left; }
  .toast .bar.run { animation: countdown linear forwards; }
  @keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; }
  .sheet-inner { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheet h2 { font-size: 18px; margin: 0; }
  .sheet label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 4px; }
  .sheet input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  .primary { width: 100%; margin-top: 16px; padding: 12px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
  .note { font-size: 13px; color: var(--sub); margin-top: 12px; }
  .note.ok { color: var(--ok); } .note.ng { color: var(--ng); }
  .queue-list { margin-top: 8px; font-size: 14px; }
  .queue-list div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <div>
      <div class="label" id="monthLabel">今月の支出</div>
      <div class="spent" id="spent">¥0</div>
    </div>
    <div class="top-right">
      <span class="sync" id="sync" role="status"></span>
      <button class="icon" id="openSettings" aria-label="設定">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="display" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="amount zero" id="amount">¥0</div>
  </section>

  <section class="cats" id="cats" aria-label="カテゴリ（押すと記録）"></section>

  <section class="pad" id="pad" aria-label="電卓">
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key op" data-key="back" aria-label="1文字消す">⌫</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key op" data-key="clear" aria-label="全部消す">C</button>
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key op plus" data-key="+" aria-label="足す">+</button>
    <button class="key zero" data-key="0">0</button>
    <button class="key" data-key="00">00</button>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden>
  <span class="msg" id="toastMsg"></span>
  <button id="undo">取り消す</button>
  <span class="bar" id="toastBar"></span>
</div>

<div class="sheet" id="settings" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>設定</h2>
      <button class="icon" id="closeSettings" aria-label="閉じる">✕</button>
    </div>
    <div class="note">この端末にだけ保存されます。ホーム画面から開いた KOZENI と Safari のタブでは、保存場所が別です。</div>
    <label for="url">GAS ウェブアプリの URL</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="token">合言葉</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="save">保存して接続を確かめる</button>
    <div class="note" id="connNote"></div>
    <div id="queueBox" hidden>
      <label>未送信の記録</label>
      <div class="queue-list" id="queueList"></div>
      <button class="primary" id="retry">今すぐ送る</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
